name: moumou-home
services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: home
      POSTGRES_USER: home
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U home -d home"]
      interval: 10s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cms
      args:
        PUBLIC_URL: https://${CMS_DOMAIN:?Set CMS_DOMAIN}
    restart: unless-stopped
    depends_on:
      database: { condition: service_healthy }
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://${CMS_DOMAIN}
      PROXY: 'true'
      DATABASE_CLIENT: postgres
      DATABASE_HOST: database
      DATABASE_NAME: home
      DATABASE_USERNAME: home
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      APP_KEYS: ${APP_KEYS:?Set APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?Set API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?Set TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      INQUIRY_SECRET: ${INQUIRY_SECRET:?Set INQUIRY_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
      WEB_URL: http://web:3000
      SEED_DEMO: 'true'
    volumes:
      - uploads:/workspace/apps/cms/public/uploads
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_CMS_URL: https://${CMS_DOMAIN}
        SITE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
    restart: unless-stopped
    depends_on:
      cms: { condition: service_healthy }
    environment:
      STRAPI_URL: http://cms:1337
      NEXT_PUBLIC_CMS_URL: https://${CMS_DOMAIN}
      SITE_URL: https://${SITE_DOMAIN}
      INQUIRY_SECRET: ${INQUIRY_SECRET}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      TRUST_PROXY: 'true'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    ports: ['80:80', '443:443', '443:443/udp']
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      CMS_DOMAIN: ${CMS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  uploads:
  caddy_data:
  caddy_config:
